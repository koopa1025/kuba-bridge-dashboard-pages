<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeGame Team Map · Hive Stack 2026-05</title>
  <style>
    :root {
      --bg: #eef4f7;
      --cyan: #43dcff;
      --cyan-soft: rgba(67, 220, 255, 0.56);
      --gold: #ffd166;
      --green: #76e5bb;
      --purple: #c4a5ff;
      --white: #f0fbff;
      --muted: #adc8d7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(67, 178, 225, 0.16), transparent 34%),
        linear-gradient(145deg, #f7fafb 0%, var(--bg) 58%, #e1ebf0 100%);
      color: var(--white);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .frame {
      width: min(100vw, 1600px);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(42, 125, 154, 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 125, 154, 0.075) 1px, transparent 1px),
        linear-gradient(145deg, rgba(248, 251, 252, 0.98), rgba(231, 240, 244, 0.98));
      background-size: 36px 36px, 36px 36px, 100% 100%;
      border: 1px solid rgba(51, 126, 153, 0.22);
      box-shadow: 0 28px 70px rgba(22, 54, 73, 0.18);
    }

    .frame::before, .frame::after {
      content: ""; position: absolute; pointer-events: none;
      border: 1px solid rgba(42, 125, 154, 0.16); inset: 18px;
    }
    .frame::after { inset: 29px; border-color: rgba(170, 129, 31, 0.14); }

    svg { display: block; width: 100%; height: 100%; }

    .title { fill: #183244; font-size: 30px; font-weight: 780; letter-spacing: 0; }
    .subtitle { fill: #526f7f; font-size: 14px; }
    .layer-tag { fill: var(--cyan); font-size: 14px; font-weight: 760; letter-spacing: 1.6px; }
    .main-label { fill: var(--white); font-size: 22px; font-weight: 780; }
    .sub-label { fill: #d8eef7; font-size: 13px; }
    .cell-title { fill: #ffffff; font-size: 14px; font-weight: 760; }
    .cell-sub { fill: #cfe8f2; font-size: 11px; }
    .small { fill: #d8eef7; font-size: 11px; }
    .tiny { fill: var(--muted); font-size: 10px; }

    .gold { fill: var(--gold); }
    .cyan { fill: var(--cyan); }
    .green { fill: var(--green); }
    .purple { fill: var(--purple); }

    .role-label {
      fill: #f7fbff;
      stroke: rgba(2, 14, 24, 0.9);
      stroke-width: 3px;
      paint-order: stroke fill;
      font-size: 11px;
      font-weight: 720;
    }

    .module-label { fill: #eafaff; font-size: 9px; font-weight: 680; }
    .module-panel { fill: rgba(4, 23, 38, 0.84); stroke: rgba(67, 220, 255, 0.58); stroke-width: 1; }
    .module-panel-platform { fill: rgba(15, 23, 42, 0.9); stroke: rgba(148, 163, 184, 0.66); stroke-width: 1; }

    .takeaway-title { font-size: 16px; font-weight: 760; }
    .takeaway-copy { fill: #d8eef7; font-size: 12px; }

    .panel { fill: rgba(3, 14, 24, 0.9); stroke: rgba(67, 220, 255, 0.45); stroke-width: 1.2; }
    .panel-gold { fill: rgba(3, 14, 24, 0.9); stroke: rgba(255, 209, 102, 0.52); stroke-width: 1.2; }
    .panel-purple { fill: rgba(3, 14, 24, 0.9); stroke: rgba(196, 165, 255, 0.55); stroke-width: 1.2; }

    @media (max-width: 900px) { .frame { width: 1600px; } }
  </style>
</head>
