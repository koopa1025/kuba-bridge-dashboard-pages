<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #1e293b; }
    .node-label { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .sub-label { font-size: 13px; fill: #64748b; }
  </style>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="50" text-anchor="middle" class="title" style="cursor: pointer;">WeGame AI Native 架构</text>

  <g id="node-mad" style="cursor: pointer;">
    <rect x="340" y="100" width="280" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" style="cursor: pointer;"/>
    <text x="480" y="132" text-anchor="middle" class="node-label" style="cursor: pointer;">Product MAD</text>
    <text x="480" y="152" text-anchor="middle" class="sub-label" style="cursor: pointer;">Mission / Anchor / Design</text>
  </g>

  <g id="node-project" style="cursor: pointer;">
    <rect x="340" y="220" width="280" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" style="cursor: pointer;"/>
    <text x="480" y="255" text-anchor="middle" class="node-label" style="cursor: pointer;">Project 层</text>
  </g>

  <g id="node-cell" style="cursor: pointer;">
    <rect x="140" y="330" width="200" height="55" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2" style="cursor: pointer;"/>
    <text x="240" y="363" text-anchor="middle" class="node-label" style="cursor: pointer;">Capability Cell</text>
  </g>

  <g id="node-pod" style="cursor: pointer;">
    <rect x="620" y="330" width="200" height="55" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2" style="cursor: pointer;"/>
    <text x="720" y="363" text-anchor="middle" class="node-label" style="cursor: pointer;">Pod</text>
  </g>

  <g id="node-tech" style="cursor: pointer;">
    <rect x="360" y="440" width="240" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" style="cursor: pointer;"/>
    <text x="480" y="470" text-anchor="middle" class="node-label" style="cursor: pointer;">Tech Principal</text>
  </g>

  <line x1="480" y1="170" x2="480" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" style="cursor: pointer;"/>
  <path d="M 420,280 L 280,330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowBlue)" style="cursor: pointer;"/>
  <path d="M 540,280 L 680,330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowBlue)" style="cursor: pointer;"/>
  <path d="M 240,385 L 420,440" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowBlue)" style="cursor: pointer;"/>
  <path d="M 720,385 L 540,440" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowBlue)" style="cursor: pointer;"/>
</svg>